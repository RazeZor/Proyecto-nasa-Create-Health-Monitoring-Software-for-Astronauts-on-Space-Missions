name: Contexto y tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contexto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      - name: Lint de Python (ruff)
        run: pip install -q ruff && ruff check .
      - name: Contexto para IA al día
        run: python tools/contextgen/contextgen.py --check
      - name: Avisos de puntos clave y del patrón de carpetas
        run: python tools/contextgen/contextgen.py --lint
      - name: Traducciones al inglés pendientes (informativo, no bloquea)
        run: python packages/i18n/i18n.py
      - name: Tests de Python (cada módulo con test_*.py)
        run: |
          for d in pipelines/*/ packages/*/ tools/*/ apps/*/; do
            [ -d "$d" ] || continue
            if ls "$d"test_*.py >/dev/null 2>&1; then
              echo "== $d"
              [ -f "$d"requirements.txt ] && pip install -q -r "$d"requirements.txt
              python -m unittest discover -s "$d" || exit 1
            fi
          done
      - name: Tests de TypeScript (motor y lógica de la app; Node ejecuta TS sin compilar)
        run: node --test packages/engine/*.test.ts apps/web/lib/*.test.ts tools/validacion/*.test.ts tools/presentacion/*.test.cjs

  web:
    # el front no lo cubren los tests de lib/: un error de tipos o un build roto en un componente solo se ve compilando
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      - name: pnpm (la versión de packageManager)
        uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
          run_install: false
      - name: Dependencias exactas del lockfile
        run: pnpm install --frozen-lockfile
      - name: Tipos
        run: pnpm exec tsc --noEmit
      - name: Build
        run: pnpm build
